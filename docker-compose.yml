version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: searchos
      POSTGRES_PASSWORD: searchos
      POSTGRES_DB: searchos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # Frontend, worker, n8n, crawler services are added in later phases
  # once they have real functionality - not stubbed here to avoid
  # empty containers that give false confidence.

volumes:
  postgres_data:
